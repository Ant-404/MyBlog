server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  config:
    import:
      - optional:file:./backend/.env[.properties]
      - optional:file:./.env[.properties]
  application:
    name: myblog-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:MyBlog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 2
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false
logging:
  level:
    com.myblog: INFO
blog:
  media:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  admin:
    username: ${ADMIN_USERNAME:hanant}
    password: ${ADMIN_PASSWORD:}
    display-name: 憨Ant
